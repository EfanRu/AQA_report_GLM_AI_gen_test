services:
  postgres:
    image: postgres:16-alpine
    container_name: testreport-postgres
    environment:
      POSTGRES_USER: testreport
      POSTGRES_PASSWORD: testreport
      POSTGRES_DB: testreport
    ports:
      - "5432:5432"
    volumes:
      - testreport-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U testreport -d testreport"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  testreport-pgdata:
